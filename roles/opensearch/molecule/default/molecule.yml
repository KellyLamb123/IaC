---
ansible:
  cfg:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..

  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_PROJECT_DIRECTORY}/../../inventory.ini
        - --ask-vault-pass

scenario:
  test_sequence:
    - syntax
    - converge
    - idempotence
    - verify
