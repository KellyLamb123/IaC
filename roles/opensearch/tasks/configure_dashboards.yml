---
- name: Configure OpenSearch Dashboards using Jinja2 template
  ansible.builtin.template:
    src: opensearch_dashboards.yml.j2
    dest: "{{ opensearch_dashboards_config_path }}"
    owner: root
    group: opensearch-dashboards
    mode: "0640"
  notify: Restart OpenSearch Dashboards

- name: Apply pending OpenSearch Dashboards handler
  ansible.builtin.meta: flush_handlers

- name: Enable and start OpenSearch Dashboards service
  ansible.builtin.systemd_service:
    name: opensearch-dashboards
    enabled: true
    state: started