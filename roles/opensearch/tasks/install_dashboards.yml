- name: Install OpenSearch Dashboards specified version
  ansible.builtin.apt:
    name: "{{ opensearch_dashboards_package_name }}={{ opensearch_version }}"
    state: present
    policy_rc_d: 101
  environment:
    DISABLE_SECURITY_DASHBOARDS_PLUGIN: "false"
  notify: Restart OpenSearch Dashboards

- name: Check Security Dashboards plugin directory
  ansible.builtin.stat:
    path: /usr/share/opensearch-dashboards/plugins/securityDashboards
  register: opensearch_dashboards_security_plugin

- name: Stop Dashboards before removing Security plugin
  ansible.builtin.systemd_service:
    name: opensearch-dashboards
    state: stopped
  when: opensearch_dashboards_security_plugin.stat.exists

- name: Remove Security Dashboards plugin if present
  ansible.builtin.command:
    argv:
      - /usr/share/opensearch-dashboards/bin/opensearch-dashboards-plugin
      - remove
      - securityDashboards
      - --allow-root
    removes: /usr/share/opensearch-dashboards/plugins/securityDashboards
  notify: Restart OpenSearch Dashboards

- name: Check installed OpenSearch Dashboards version
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - "-f=${Version}"
      - "{{ opensearch_dashboards_package_name }}"
  register: opensearch_dashboards_installed_version
  changed_when: false

- name: Verify installed OpenSearch Dashboards version
  ansible.builtin.assert:
    that:
      - opensearch_dashboards_installed_version.stdout == opensearch_version
    fail_msg: "Incorrect OpenSearch Dashboards version is installed."
    success_msg: "OpenSearch Dashboards {{ opensearch_version }} is installed."