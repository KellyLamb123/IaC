---
- name: Wait until secured OpenSearch API is ready
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ opensearch_http_port }}/_cluster/health"
    method: GET
    url_username: admin
    url_password: "{{ vault_opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    return_content: true
    status_code: 200
  register: opensearch_health
  until:
    - (opensearch_health.status | default(0)) == 200
    - >-
      (opensearch_health.json | default({})).get('status', '')
      in ['green', 'yellow']
  retries: "{{ opensearch_readiness_retries }}"
  delay: "{{ opensearch_readiness_delay }}"
  no_log: true

- name: Get secured OpenSearch information
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ opensearch_http_port }}"
    method: GET
    url_username: admin
    url_password: "{{ vault_opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    return_content: true
    status_code: 200
  register: opensearch_info
  no_log: true

- name: Verify OpenSearch version and cluster name
  ansible.builtin.assert:
    that:
      - opensearch_info.json.version.number == opensearch_version
      - opensearch_info.json.cluster_name == opensearch_cluster_name
    fail_msg: "OpenSearch API returned unexpected configuration."
    success_msg: "Secured OpenSearch {{ opensearch_version }} is ready."

- name: Check OpenSearch Security plugin health
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ opensearch_http_port }}/_plugins/_security/health"
    method: GET
    validate_certs: false
    return_content: true
    status_code: 200
  register: opensearch_security_health

- name: Verify OpenSearch Security is active
  ansible.builtin.assert:
    that:
      - opensearch_security_health.json.status == 'UP'
      - opensearch_security_health.json.mode == 'strict'
    fail_msg: "OpenSearch Security is not ready."
    success_msg: "OpenSearch Security is active and ready."